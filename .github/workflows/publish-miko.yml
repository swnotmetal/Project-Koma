name: Publish Miko alpha

on:
  workflow_dispatch:

concurrency:
  group: publish-miko-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci
      # Tests import workspace package entry points from dist, as in CI.
      - run: npm run build
      - run: npm test
      - run: npm run typecheck -w koma-miko -w koma-miko-dsh

      - name: Publish Miko, then synchronize alpha/latest
        run: npm publish -w koma-miko --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish DSH adapter, then synchronize alpha/latest
        run: npm publish -w koma-miko-dsh --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
