name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vitest 4/Rolldown require Node 20.19+ (Node 18 fails during startup).
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Build before typecheck: koma-*-mcp packages import koma-core / koma-gate
      # through their `types` entry (dist/index.d.ts), which only exists after build.
      - name: Build all packages
        run: npm run build

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Smoke test (pack + clean install + import)
        run: npm run smoke:npm
