name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: Publish koma-gate
        run: npm publish --access public
        working-directory: packages/koma-gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish koma-scout
        run: npm publish --access public
        working-directory: packages/koma-scout
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish koma-core
        run: npm publish --access public
        working-directory: packages/koma-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
