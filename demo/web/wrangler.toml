name = "koma-demo"
main = "src/index.js"
# compatibility_date >= 2026-08-04 enables Node.js compatibility by default
# (needed for koma-gate's `crypto.createHash`).
compatibility_date = "2026-08-17"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

# Global, atomic rate limiter + daily budget counter.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "RateLimiter" ]

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "koma-demo-feedback"
database_id = "6b0d9d41-1070-4fcd-9538-3fdb82fe1caa"

[triggers]
crons = [ "17 3 * * *" ]

# --- Optional kill switch (instant off-switch) ---
# 1. Create a KV namespace in the Cloudflare dashboard.
# 2. Uncomment the block below and paste the namespace id.
# 3. To disable the demo instantly: set the KV key `disabled` to `true`.
# [[kv_namespaces]]
# binding = "KILLSWITCH"
# id = "YOUR_KV_NAMESPACE_ID"
