<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="320" y="36" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">KOMA CORE</text>

  <!-- SEARCH node -->
  <text x="320" y="72" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle">SEARCH</text>

  <!-- arrow down -->
  <line x1="320" y1="84" x2="320" y2="104" stroke="#8b949e" stroke-width="2"/>
  <polygon points="314,104 326,104 320,116" fill="#8b949e"/>

  <!-- PUBLIC INDEX box -->
  <rect x="160" y="120" width="320" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="146" fill="#58a6ff" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="bold">PUBLIC INDEX</text>
  <text x="320" y="168" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">metadata</text>
  <text x="320" y="188" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">opaque token</text>

  <!-- arrow down -->
  <line x1="320" y1="216" x2="320" y2="236" stroke="#8b949e" stroke-width="2"/>
  <polygon points="314,236 326,236 320,248" fill="#8b949e"/>

  <!-- PRIVATE STORE box -->
  <rect x="160" y="252" width="320" height="92" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="278" fill="#3fb950" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="bold">PRIVATE STORE</text>
  <text x="320" y="300" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">actual data</text>
  <text x="320" y="320" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">access policy</text>

  <!-- Big principle text -->
  <text x="320" y="382" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Discovery ≠ Authorization</text>
</svg>
