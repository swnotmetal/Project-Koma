<svg xmlns="http://www.w3.org/2000/svg" width="640" height="396" viewBox="0 0 640 396">
  <rect width="640" height="396" fill="#0d1117"/>

  <!-- Golden rectangle canvas: 640 / 1.618 ≈ 396 -->

  <!-- Title -->
  <text x="320" y="34" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">KOMA CORE</text>

  <!-- SEARCH -->
  <text x="320" y="70" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle">SEARCH</text>

  <!-- arrow down -->
  <line x1="320" y1="82" x2="320" y2="98" stroke="#8b949e" stroke-width="2"/>
  <polygon points="314,98 326,98 320,108" fill="#8b949e"/>

  <!-- PUBLIC INDEX box -->
  <rect x="180" y="112" width="280" height="78" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="136" fill="#58a6ff" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="bold">PUBLIC INDEX</text>
  <text x="320" y="158" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">metadata</text>
  <text x="320" y="178" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">opaque token</text>

  <!-- arrow down -->
  <line x1="320" y1="194" x2="320" y2="210" stroke="#8b949e" stroke-width="2"/>
  <polygon points="314,210 326,210 320,220" fill="#8b949e"/>

  <!-- PRIVATE STORE box -->
  <rect x="180" y="224" width="280" height="78" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="248" fill="#3fb950" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="bold">PRIVATE STORE</text>
  <text x="320" y="270" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">actual data</text>
  <text x="320" y="290" fill="#c9d1d9" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">access policy</text>

  <!-- Big principle -->
  <text x="320" y="366" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Discovery ≠ Authorization</text>
</svg>
